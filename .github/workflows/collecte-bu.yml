name: Pipeline BU — Collecte signaux rareté

# CRON DESARME VOLONTAIREMENT.
#
# Decision : le pipeline est d'abord teste a la main pendant plusieurs jours,
# lance depuis Claude Code, avant d'etre confie a un declencheur automatique.
# Les selecteurs d'extraction n'ont jamais tourne contre les vraies sources ;
# armer le cron maintenant reviendrait a accumuler du bruit sans savoir lequel.
#
# Pour reactiver quand le journal de test le justifie : decommenter le bloc
# schedule ci-dessous. Criteres d'armement dans pipeline-bu/JOURNAL-TEST.md.
#
# schedule:
#   # Lundi, mardi, jeudi, vendredi a 06h00 UTC
#   - cron: '0 6 * * 1,2,4,5'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (affiche les logs sans écrire les données)'
        required: false
        default: 'false'
        type: boolean

permissions:
  # write : necessaire au seul reversement de pipeline-bu/bench.csv (comptes du
  # jour). Le vivier lui-meme n'est jamais commite, cf. pipeline-bu/data/.gitignore.
  contents: write
  actions: read

jobs:
  collecte-bu:
    name: Collecte BU — signaux rareté pièces
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vérification pre-run
        run: |
          echo "=== Hub4Fix Pipeline BU ==="
          echo "Date : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "Branche : ${{ github.ref_name }}"
          echo "Dry run : ${{ github.event.inputs.dry_run || 'false' }}"
          python3 --version

      # Le meme programme que celui lance a la main (veille.py), pour que le
      # compte rendu du matin soit identique quel que soit l'endroit d'ou on
      # le declenche. Ce runner a un acces reseau sortant complet, contrairement
      # a l'environnement de developpement Claude Code dont la politique reseau
      # refuse le CONNECT vers tout sauf GitHub.
      - name: Veille du matin
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 veille.py --sec
          else
            python3 veille.py
          fi
        # Pas de secrets injectés — le script n'utilise que des API publiques sans clé

      # Le banc d'essai (comptes du jour, rien de sensible) est reversé dans le
      # depot : c'est lui qui permet de comparer les matins entre eux, et il ne
      # sert a rien s'il disparait avec le runner.
      - name: Reverser le banc d'essai
        if: success()
        run: |
          if ! git diff --quiet -- pipeline-bu/bench.csv 2>/dev/null; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pipeline-bu/bench.csv
            git commit -m "Veille $(date -u '+%Y-%m-%d') : ligne de banc d'essai"
            git push
          else
            echo "Banc d'essai inchange, rien a pousser."
          fi

      - name: Résumé du run
        if: always()
        run: |
          LOG_FILE="pipeline-bu/data/run_log.jsonl"
          if [ -f "$LOG_FILE" ]; then
            echo "=== Dernier log de run ==="
            tail -1 "$LOG_FILE"
          else
            echo "Aucun log produit."
          fi

      - name: Upload CSV comme artifact (accès authentifié)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vivier-brut-${{ github.run_number }}-${{ github.run_id }}
          path: |
            pipeline-bu/data/vivier_brut_collecte.csv
            pipeline-bu/data/run_log.jsonl
          retention-days: 90
          if-no-files-found: warn
        # Les artifacts GitHub Actions sont privés — accès authentifié uniquement.
        # NE PAS committer les données CSV dans le repo (voir pipeline-bu/data/.gitignore).
        # Pour usage mobile : télécharger l'artifact via GitHub UI (Actions → run → Artifacts).
