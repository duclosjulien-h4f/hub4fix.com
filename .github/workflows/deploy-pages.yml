name: Deploy to GitHub Pages

# TRANSITOIRE — ce workflow disparaît quand le site sera servi par Cloudflare
# Pages (cf. MIGRATION-CLOUDFLARE-PAGES.md). Objectif de la bascule : rendre le
# dépôt privé sans couper le site, ce que GitHub Pages ne permet pas sur le
# plan gratuit alors que Cloudflare Pages le fait.
#
# Il n'assemble rien lui-même : le périmètre publiable est décidé par
# ./build-site.sh, appelé aussi par Cloudflare Pages. Un seul endroit décide
# de ce qui a le droit d'être public, pour que changer d'hébergeur ne
# réintroduise pas une fuite que l'autre avait bouchée.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Échoue si un fichier sensible se retrouve dans le site assemblé : un
      # déploiement raté est visible, une fuite silencieuse ne l'est pas.
      - name: Assembler le site publiable
        run: ./build-site.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
