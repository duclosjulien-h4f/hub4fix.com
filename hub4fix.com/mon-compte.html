<!DOCTYPE html>
<html lang="fr">
<head>
<script>document.documentElement.style.visibility='hidden';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon compte — Hub⁴Fix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/glass-sphere.css">
<style>
:root{--ivory:#FAF8F5;--warm-white:#F3EEE8;--cream:#EDE6DC;--sand:#D4C9B8;--stone:#A89F91;--earth:#7A7268;--charcoal:#3B3632;--night:#1C1A18;--gold:#B8963E;--gold-light:#D4B15F;--gold-pale:rgba(184,150,62,0.08);--gold-glow:rgba(184,150,62,0.15);--red:#C8102E;--red-soft:rgba(200,16,46,0.06);--red-medium:rgba(200,16,46,0.18);--green:#2D8B5E;--font-serif:'Cormorant Garamond',serif;--font-sans:'Karla',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--ivory);color:var(--charcoal);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
::selection{background:var(--gold-glow);color:var(--night)}

/* ════ NAV ════ */
nav{position:sticky;top:0;z-index:100;padding:.8rem 4rem;display:flex;justify-content:space-between;align-items:center;background:rgba(243,238,232,0.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(237,230,220,0.4)}
.nav-brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.nav-logo{width:auto;height:32px}
.nav-wordmark{font-family:var(--font-serif);font-size:1.1rem;font-weight:500;color:var(--night);letter-spacing:.02em}
.nav-wordmark sup{color:var(--red);font-size:.7em;vertical-align:super;line-height:0}
.nav-right{display:flex;align-items:center;gap:1rem}
.nav-back{text-decoration:none;color:var(--earth);font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:.3rem;transition:color .2s}
.nav-back:hover{color:var(--red)}
.nav-account{position:relative}
.nav-account-btn{display:flex;align-items:center;gap:.3rem;background:none;border:none;cursor:pointer;padding:.3rem;border-radius:2px;transition:background .2s}
.nav-account-btn:hover{background:var(--cream)}
.nav-account-icon{width:22px;height:22px;color:var(--charcoal)}
.nav-token-badge{background:var(--red);color:white;font-size:.65rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 5px;line-height:1}

/* ════ LAYOUT ════ */
.compte-layout{display:grid;grid-template-columns:auto 1fr;min-height:calc(100vh - 52px)}
.compte-sidebar{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;border-right:1px solid var(--cream);background:var(--warm-white);padding:1.5rem 1rem 1.5rem .8rem;min-width:260px}
.compte-content{padding:2.5rem 3.5rem;max-width:960px}

/* ════ SIDEBAR MINDMAP ════ */
.sb-header{display:flex;align-items:center;gap:.7rem;padding:0 .3rem .8rem;border-bottom:1px solid var(--cream);margin-bottom:1rem}
.sb-avatar{width:40px;height:40px;border-radius:50%;background:var(--gold);color:white;display:flex;align-items:center;justify-content:center;font-family:var(--font-serif);font-size:1rem;font-weight:600;flex-shrink:0}
.sb-info{display:flex;flex-direction:column;min-width:0}
.sb-name{font-weight:600;font-size:.88rem;color:var(--night)}
.sb-email{font-size:.68rem;color:var(--earth);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-tokens{display:flex;align-items:center;gap:.3rem;margin-left:auto;background:var(--red-soft);padding:3px 8px;border-radius:10px;flex-shrink:0}
.sb-tokens .t-icon{font-size:.65rem;color:var(--red)}
.sb-tokens strong{font-family:'Courier New',monospace;font-size:.85rem;color:var(--red)}

/* Sidebar tree */
.sb-tree{position:relative;padding:0 .2rem}
.sb-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.sb-svg path{fill:none;stroke-width:1.5;stroke-linecap:round}
.sb-svg circle{transition:opacity .2s}
.sb-grid{display:grid;grid-template-columns:auto auto auto;gap:0 1.2rem;align-items:start}
.sb-col{display:flex;flex-direction:column;gap:.25rem;z-index:1;padding:.1rem 0}
.sb-col:empty{display:none}

/* Category pills (level 0) */
.sb-cat{padding:.4rem .7rem;font-size:.72rem;font-weight:600;letter-spacing:.02em;background:white;border:1.5px solid var(--cream);border-radius:14px;cursor:pointer;transition:all .25s;color:var(--charcoal);white-space:nowrap;position:relative;display:flex;align-items:center;gap:.35rem}
.sb-cat svg{width:14px;height:14px;flex-shrink:0;opacity:.6}
.sb-cat:hover{background:var(--gold-pale);color:var(--gold)}
.sb-cat.active{color:white;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sb-cat.active svg{opacity:1}
.sb-col.has-selection .sb-cat:not(.active){opacity:.35;transform:scale(.95)}

/* Section pills (level 1) */
.sb-sec{padding:.35rem .6rem;font-size:.7rem;font-weight:500;background:white;border:1.5px solid var(--cream);border-radius:12px;cursor:pointer;transition:all .25s;color:var(--earth);white-space:nowrap;display:flex;align-items:center;gap:.3rem}
.sb-sec svg{width:13px;height:13px;flex-shrink:0;opacity:.5}
.sb-sec:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-pale)}
.sb-sec.active{color:white;background:var(--gold);border-color:var(--gold);font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.sb-sec.active svg{opacity:1}
.sb-sec.locked{opacity:.45;cursor:default}
.sb-sec.locked::after{content:'🔒';font-size:.55rem;margin-left:.2rem}

/* Sub-branch pills (level 2 — e.g. Partenaire children) */
.sb-sub{padding:.32rem .55rem;font-size:.68rem;font-weight:500;background:white;border:1.5px solid var(--cream);border-radius:11px;cursor:pointer;transition:all .25s;color:var(--earth);white-space:nowrap;display:flex;align-items:center;gap:.3rem}
.sb-sub svg{width:12px;height:12px;flex-shrink:0;opacity:.5}
.sb-sub:hover{border-color:#6b5b95;color:#6b5b95;background:rgba(107,91,149,.06)}
.sb-sub.active{color:white;background:#6b5b95;border-color:#6b5b95;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.sb-sub.active svg{opacity:1}
/* Partenaire pill highlighted when its sub-branch is open */
.sb-sec.has-branch{border-color:#6b5b95;color:#6b5b95;font-weight:600}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes sbFadeIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:translateX(0)}}
.sb-anim{animation:sbFadeIn .2s ease both}

/* ════ CONTENT SECTIONS ════ */
.sec-title{font-family:var(--font-serif);font-size:1.8rem;font-weight:400;color:var(--night);margin-bottom:.3rem}
.sec-overline{font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1.2rem;display:flex;align-items:center;gap:.8rem}
.sec-overline::before{content:'';width:20px;height:1px;background:var(--gold)}
.sec-desc{font-size:.88rem;color:var(--earth);line-height:1.7;margin-bottom:2rem;max-width:640px}

/* Cards */
.card{background:white;border:1px solid var(--cream);border-radius:16px;padding:1.4rem;margin-bottom:1rem;transition:box-shadow .2s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.05)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;margin-bottom:1.5rem}

/* Table */
.data-table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:1.5rem}
.data-table th{text-align:left;font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);padding:.6rem .8rem;border-bottom:2px solid var(--cream)}
.data-table td{padding:.7rem .8rem;border-bottom:1px solid rgba(237,230,220,.5);color:var(--charcoal)}
.data-table tr:hover td{background:var(--gold-pale)}
.badge{display:inline-flex;align-items:center;padding:.2rem .6rem;border-radius:8px;font-size:.68rem;font-weight:600}
.badge-gold{background:var(--gold-pale);color:var(--gold)}
.badge-green{background:rgba(45,139,94,.08);color:var(--green)}
.badge-red{background:var(--red-soft);color:var(--red)}
.badge-stone{background:rgba(168,159,145,.1);color:var(--stone)}

/* Forms */
.form-group{margin-bottom:1.2rem}
.form-label{display:block;font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--earth);margin-bottom:.35rem}
.form-input{width:100%;padding:.55rem .8rem;font-size:.85rem;font-family:var(--font-sans);border:1px solid var(--cream);border-radius:10px;background:white;color:var(--charcoal);transition:border-color .2s;outline:none}
.form-input:focus{border-color:var(--gold)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.3rem;font-size:.78rem;font-weight:600;font-family:var(--font-sans);border:none;border-radius:10px;cursor:pointer;transition:all .2s}
.btn-gold{background:var(--gold);color:white}
.btn-gold:hover{background:#a08030}
.btn-outline{background:transparent;border:1.5px solid var(--cream);color:var(--earth)}
.btn-outline:hover{border-color:var(--gold);color:var(--gold)}

/* Token counter */
.token-display{display:flex;align-items:center;gap:1rem;padding:1.5rem;background:linear-gradient(135deg,var(--gold-pale),rgba(184,150,62,.12));border-radius:16px;margin-bottom:1.5rem}
.token-count{font-family:var(--font-serif);font-size:3rem;font-weight:600;color:var(--gold)}
.token-label{font-size:.78rem;color:var(--earth)}
.token-history{list-style:none}
.token-history li{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid rgba(237,230,220,.4);font-size:.82rem}
.token-history .t-date{color:var(--stone);font-size:.72rem}
.token-history .t-plus{color:var(--green);font-weight:600}
.token-history .t-minus{color:var(--red);font-weight:600}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{text-align:center;padding:1.2rem;background:white;border:1px solid var(--cream);border-radius:16px}
.stat-val{font-family:var(--font-serif);font-size:1.8rem;font-weight:500;color:var(--night)}
.stat-label{font-size:.68rem;color:var(--stone);margin-top:.2rem}

/* Progress bar */
.progress{height:6px;background:var(--cream);border-radius:3px;overflow:hidden;margin:.4rem 0}
.progress-fill{height:100%;border-radius:3px;transition:width .5s}

/* Toggle */
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid rgba(237,230,220,.4)}
.toggle-label{font-size:.85rem;color:var(--charcoal)}
.toggle-sub{font-size:.7rem;color:var(--stone)}
.toggle{width:40px;height:22px;background:var(--cream);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--gold)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:white;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle.on::after{transform:translateX(18px)}

/* Alert items */
.alert-item{display:flex;gap:.8rem;padding:.8rem;border-radius:12px;background:white;border:1px solid var(--cream);margin-bottom:.6rem;align-items:center}
.alert-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.alert-dot.new{background:var(--red)}
.alert-dot.read{background:var(--cream)}
.alert-text{flex:1;font-size:.82rem;line-height:1.4}
.alert-date{font-size:.68rem;color:var(--stone);white-space:nowrap}

/* Upload area */
.upload-zone{border:2px dashed var(--cream);border-radius:16px;padding:2rem;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:1.5rem}
.upload-zone:hover{border-color:var(--gold)}
.upload-icon{font-size:2rem;margin-bottom:.5rem;opacity:.4}
.upload-text{font-size:.82rem;color:var(--stone)}

/* Royalty bar */
.royalty-bar{display:flex;align-items:center;gap:.6rem;font-size:.82rem;margin-bottom:.5rem}
.royalty-bar .r-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.royalty-bar .r-amount{font-weight:600;color:var(--gold);white-space:nowrap}

/* ════ RESPONSIVE ════ */
@media(max-width:768px){
  nav{padding:.7rem 1.2rem}
  .compte-layout{grid-template-columns:1fr}
  .compte-sidebar{position:relative;top:0;height:auto;border-right:none;border-bottom:1px solid var(--cream);padding:.8rem}
  .sb-grid{display:flex;flex-wrap:wrap;gap:.35rem}
  .sb-col{flex-direction:row;flex-wrap:wrap;gap:.3rem}
  .sb-svg{display:none}
  .sb-col.has-selection .sb-cat:not(.active){opacity:1;transform:none}
  .compte-content{padding:1.5rem 1.2rem}
  .form-row{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

  /* ════ SVG helpers (same as produit.html) ════ */
  function svgC(x1,y1,x2,y2,col,op){
    var dx=x2-x1, cp=Math.min(Math.abs(dx)*.5,40);
    return '<path d="M'+x1+','+y1+' C'+(x1+cp)+','+y1+' '+(x2-cp)+','+y2+' '+x2+','+y2+'" stroke="'+col+'" opacity="'+(op||.4)+'"/>';
  }
  function svgD(x,y,r,col){ return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+col+'"/>'; }

  function alignCol(colId, parentEl){
    var col = document.getElementById(colId);
    if(!col) return;
    col.style.paddingTop = '';
    if(!parentEl || !col.firstElementChild) return;
    var pR = parentEl.getBoundingClientRect();
    var cR = col.firstElementChild.getBoundingClientRect();
    var diff = (pR.top + pR.height/2) - (cR.top + cR.height/2);
    if(diff > 4) col.style.paddingTop = (parseFloat(getComputedStyle(col).paddingTop) + diff) + 'px';
  }

  function drawWires(){
    if(!sbSvg || !sbTree) return;
    var box = sbTree.getBoundingClientRect();
    var p = '';
    var activeCat = sbTree.querySelector('.sb-cat.active');
    if(activeCat){
      var aR = activeCat.getBoundingClientRect();
      var ax = aR.right - box.left;
      var ay = aR.top + aR.height/2 - box.top;
      var ci = parseInt(activeCat.dataset.idx);
      var col = CC[ci] || CC[0];
      // Wires: category → sections
      sbTree.querySelectorAll('.sb-sec').forEach(function(sEl){
        var sR = sEl.getBoundingClientRect();
        if(sR.height === 0) return;
        var sx = sR.left - box.left;
        var sy = sR.top + sR.height/2 - box.top;
        var isActive = sEl.classList.contains('active') || sEl.classList.contains('has-branch');
        var op = isActive ? .5 : .25;
        p += svgC(ax, ay, sx, sy, col, op);
        p += svgD(sx, sy, isActive ? 3 : 1.5, col);
      });
      p += svgD(ax, ay, 3, col);
      // Wires: branch section → sub-branches
      var branchEl = sbTree.querySelector('.sb-sec.has-branch');
      if(branchEl){
        var bR = branchEl.getBoundingClientRect();
        var bx = bR.right - box.left;
        var by = bR.top + bR.height/2 - box.top;
        var bCol = '#6b5b95';
        sbTree.querySelectorAll('.sb-sub').forEach(function(subEl){
          var subR = subEl.getBoundingClientRect();
          if(subR.height === 0) return;
          var subx = subR.left - box.left;
          var suby = subR.top + subR.height/2 - box.top;
          var isA = subEl.classList.contains('active');
          p += svgC(bx, by, subx, suby, bCol, isA ? .5 : .3);
          p += svgD(subx, suby, isA ? 3 : 1.5, bCol);
        });
        p += svgD(bx, by, 2.5, bCol);
      }
    }
    sbSvg.innerHTML = p;
  }

  /* ════ RENDER SIDEBAR ════ */
  function renderSidebar(){
    var html = '<div class="sb-col" id="sbCatsCol">';
    TREE.forEach(function(cat, i){
      var locked = cat.role && USER.roles.indexOf(cat.role) === -1;
      html += '<div class="sb-cat'+(locked?' locked':'')+'" data-idx="'+i+'" data-id="'+cat.id+'" style="border-color:'+CC[i]+'30;color:'+CC[i]+'">';
      html += IC[cat.icon] || '';
      html += cat.label;
      if(locked) html += '<span style="font-size:.55rem;margin-left:.2rem">&#x1F512;</span>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="sb-col" id="sbSecsCol"></div>';
    html += '<div class="sb-col" id="sbSubsCol"></div>';
    sbGrid.innerHTML = html;

    sbTree.querySelectorAll('.sb-cat').forEach(function(el){
      el.addEventListener('click', function(){
        var idx = parseInt(this.dataset.idx);
        if(this.classList.contains('locked')) return;
        selectCat(idx);
      });
    });
    drawWires();
  }

  function selectCat(idx){
    currentCat = idx;
    var cat = TREE[idx];
    var col = CC[idx];

    var catsCol = document.getElementById('sbCatsCol');
    catsCol.classList.add('has-selection');
    sbTree.querySelectorAll('.sb-cat').forEach(function(el, i){
      el.classList.toggle('active', i === idx);
      el.style.background = (i === idx) ? col : '';
      el.style.color = (i === idx) ? 'white' : CC[i];
      el.style.borderColor = (i === idx) ? col : CC[i] + '30';
    });

    var secsCol = document.getElementById('sbSecsCol');
    var html = '';
    cat.children.forEach(function(sec, i){
      var isActive = sec.id === currentSec;
      var isBranch = sec.id === currentBranch;
      var cls = 'sb-sec sb-anim';
      if(isActive) cls += ' active';
      if(isBranch) cls += ' has-branch';
      html += '<div class="'+cls+'" data-id="'+sec.id+'"'+(sec.branch?' data-branch="1"':'')+' style="animation-delay:'+(i*40)+'ms">';
      html += IC[sec.icon] || '';
      html += sec.label + '</div>';
    });
    secsCol.innerHTML = html;
    // Clear sub-branch column
    var subsCol = document.getElementById('sbSubsCol');
    subsCol.innerHTML = '';
    subsCol.style.paddingTop = '';

    alignCol('sbSecsCol', sbTree.querySelector('.sb-cat.active'));

    secsCol.querySelectorAll('.sb-sec').forEach(function(el){
      el.addEventListener('click', function(){
        var secId = this.dataset.id;
        if(this.dataset.branch){
          openBranch(secId);
        } else {
          closeBranch();
          navigateTo(secId);
        }
      });
    });
    drawWires();
  }

  var currentBranch = null;

  function openBranch(secId){
    currentBranch = secId;
    // Find branch data in current category
    var cat = TREE[currentCat];
    var branchData = null;
    for(var j = 0; j < cat.children.length; j++){
      if(cat.children[j].id === secId){ branchData = cat.children[j]; break; }
    }
    if(!branchData || !branchData.children) return;

    // Highlight branch pill
    sbTree.querySelectorAll('.sb-sec').forEach(function(el){
      el.classList.remove('active','has-branch');
      if(el.dataset.id === secId) el.classList.add('has-branch');
    });

    // Populate sub-branch column
    var subsCol = document.getElementById('sbSubsCol');
    var html = '';
    branchData.children.forEach(function(sub, i){
      var isActive = sub.id === currentSec;
      html += '<div class="sb-sub sb-anim'+(isActive?' active':'')+'" data-id="'+sub.id+'" style="animation-delay:'+(i*40)+'ms">';
      html += IC[sub.icon] || '';
      html += sub.label + '</div>';
    });
    subsCol.innerHTML = html;

    alignCol('sbSubsCol', sbTree.querySelector('.sb-sec.has-branch'));

    subsCol.querySelectorAll('.sb-sub').forEach(function(el){
      el.addEventListener('click', function(){
        navigateTo(this.dataset.id);
      });
    });
    drawWires();
  }

  function closeBranch(){
    currentBranch = null;
    sbTree.querySelectorAll('.sb-sec').forEach(function(el){ el.classList.remove('has-branch'); });
    var subsCol = document.getElementById('sbSubsCol');
    subsCol.innerHTML = '';
    subsCol.style.paddingTop = '';
  }

  /* ════ NAVIGATE ════ */
  function navigateTo(sectionId){
    currentSec = sectionId;
    window.location.hash = sectionId;

    // Find which category and possibly which branch this section belongs to
    var found = false;
    for(var i = 0; i < TREE.length; i++){
      for(var j = 0; j < TREE[i].children.length; j++){
        var sec = TREE[i].children[j];
        if(sec.id === sectionId){
          if(currentCat !== i) selectCat(i);
          closeBranch();
          found = true; break;
        }
        // Check sub-branches
        if(sec.children){
          for(var k = 0; k < sec.children.length; k++){
            if(sec.children[k].id === sectionId){
              if(currentCat !== i) selectCat(i);
              openBranch(sec.id);
              found = true; break;
            }
          }
        }
        if(found) break;
      }
      if(found) break;
    }

    // Highlight active section or sub
    sbTree.querySelectorAll('.sb-sec').forEach(function(el){
      if(!el.classList.contains('has-branch'))
        el.classList.toggle('active', el.dataset.id === sectionId);
    });
    sbTree.querySelectorAll('.sb-sub').forEach(function(el){
      el.classList.toggle('active', el.dataset.id === sectionId);
    });
    drawWires();

    // Render content
    var content = document.getElementById('compteContent');
    var fn = SECTIONS[sectionId];
    content.innerHTML = fn ? fn() : '<p>Section non disponible</p>';
    content.scrollTop = 0;
  }
