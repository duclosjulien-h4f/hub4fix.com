<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="alternate icon" href="favicon.ico">
<title>Hub⁴Fix — site en maintenance</title>
<meta name="description" content="Le site Hub4Fix est en maintenance. L'inscription en early access se fait sur hub4fix.eu.">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--ivory:#FAF8F5;--cream:#EDE6DC;--sand:#D4C9B8;--earth:#7A7268;--charcoal:#3B3632;--night:#1C1A18;--gold:#B8963E;--red:#C8102E}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Karla',sans-serif;background:var(--ivory);color:var(--charcoal);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
nav{padding:1.4rem 1.5rem;width:100%;max-width:720px;margin:0 auto}
.brand{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:500;color:var(--night);text-decoration:none}
.brand sup{color:var(--red);font-size:.7em}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:3rem 1.5rem 4rem}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
h1{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(2rem,6vw,3rem);line-height:1.12;color:var(--night);margin-bottom:1rem}
h1 em{font-style:italic;color:var(--red)}
.lead{color:var(--earth);line-height:1.65;margin-bottom:2rem}
a.go{display:inline-block;font-weight:600;background:var(--red);color:#fff;text-decoration:none;border-radius:10px;padding:.9rem 2rem;font-size:.95rem}
a.go:hover,a.go:focus-visible{background:#a30d25}
footer{text-align:center;font-size:.72rem;color:var(--earth);padding:2rem 1rem}
</style>
</head>
<body>
<nav><a class="brand" href="/">Hub<sup>4</sup>Fix</a></nav>
<main>
  <p class="eyebrow">Site en maintenance</p>
  <h1>Nous <em>revenons</em> bientôt.</h1>
  <p class="lead">Le site Hub4Fix est en cours de refonte. En attendant, vous pouvez rejoindre l'early access : modélisateurs et imprimeurs, dites-nous qui vous êtes.</p>
  <a class="go" href="https://hub4fix.eu/">Rejoindre l'early access</a>
</main>
<footer>Hub4Fix</footer>
</body>
</html>
