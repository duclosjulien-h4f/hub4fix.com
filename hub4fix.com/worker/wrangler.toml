# Hub4Fix — worker "h4f-admin" (espace administrateur + base centrale Pièces).
# Déploiement : npx wrangler deploy   (depuis hub4fix.com/worker/)
#
# keep_vars = true : IMPÉRATIF — préserve les variables/secrets déjà configurés
# dans le dashboard Cloudflare (ISSUER, CLIENT_ID, SESSION_SECRET, ADMIN_EMAILS,
# SHEET_ID, GOOGLE_SA_EMAIL, GOOGLE_SA_KEY, PIPELINE_TOKEN…). Sans lui, un
# `wrangler deploy` les écraserait.

name = "h4f-admin"
main = "admin.js"
compatibility_date = "2026-01-01"
keep_vars = true

# Base D1 (admins / appareils / audit).
[[d1_databases]]
binding = "DB"
database_name = "h4f_admin"
database_id = "02cfcaa2-c331-48a0-8699-d669cb7ccce4"

# Base D1 de l'espace partenaire (h4f_partner, gérée par le worker h4f-partner).
# L'admin y accède en lecture/écriture pour VALIDER les candidatures partenaires
# (partners.status -> active) et gérer les réservations. Back-office unique
# (technique A) : l'admin tranche directement dans la base partenaire.
# À créer : npx wrangler d1 create h4f_partner -> coller le database_id ci-dessous.
[[d1_databases]]
binding = "DB_PARTNER"
database_name = "h4f_partner"
database_id = "c3c71c6a-fdb8-4505-8d7c-1298ae5a6482"

# Stockage privé des images pièces (orig/<id> privé, h4f/<id> public).
[[r2_buckets]]
binding = "PIECES_R2"
bucket_name = "h4f-pieces"

# Photos de réservation (plaque + appareil + pièce), écrites par h4f-partner. L'admin y
# accède en LECTURE pour les afficher dans l'écran Réservations. Même bucket.
[[r2_buckets]]
binding = "RESERV_R2"
bucket_name = "h4f-reservations"

# Fichiers déposés : source natif + STEP. Deux écrivains — h4f-partner (tunnel
# modélisateur) et cet admin (dépôt interne, /admin/depot) — dans le même bucket, parce
# que l'aval est commun. L'écran « Modèles 3D » les relit pour l'examen, et la
# préparation du 3MF ira y lire le STEP.
[[r2_buckets]]
binding = "SUBMIT_R2"
bucket_name = "h4f-submissions"
