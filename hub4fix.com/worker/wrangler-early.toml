# Hub4Fix — worker "h4f-early" : la page early access ET son collecteur, sur hub4fix.eu.
# Déploiement : .\deploy-early.ps1   (depuis hub4fix.com/worker/)
#
# Un seul worker sert tout, en même temps :
#   - /api/early-access  -> le code de early-access.js (écrit une ligne dans le Google Sheet)
#   - tout le reste      -> la page statique du dossier early-public/ (copie de ../early-access.html)
# La page et son API sont donc sur la MÊME adresse : aucune adresse *.workers.dev (qui contient
# le nom du compte Cloudflare) n'apparait nulle part.
#
# Aucun secret à poser : l'écriture dans le Google Sheet passe par le worker h4f-collect
# (liaison interne ci-dessous), qui a déjà ses accès.
# keep_vars : préserve ce qui est déjà configuré dans le dashboard.

name = "h4f-early"
main = "early-access.js"
compatibility_date = "2026-01-01"
keep_vars = true
workers_dev = false

# Prérequis : la zone hub4fix.eu doit être sur Cloudflare (serveurs de noms changés chez Gandi : à faire pour hub4fix.eu).
# Le domaine personnalisé crée l'enregistrement DNS et le certificat tout seul.
routes = [
  { pattern = "hub4fix.eu", custom_domain = true },
]

[assets]
directory = "./early-public"
# Seule /api/* passe par le code ; le reste est servi directement depuis le dossier.
run_worker_first = ["/api/*"]

# Limite par IP : 5 envois / minute. Au-delà : 429.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Liaison interne vers le collecteur existant (jamais exposée sur internet).
[[services]]
binding = "COLLECT"
service = "h4f-collect"

# Registre des inscrits (empreintes d'e-mail + profil) : sert à répondre "déjà inscrit" sans lire le Sheet.
[[d1_databases]]
binding = "EARLY_DB"
database_name = "h4f_early"
database_id = "9d558e2c-8039-4864-8383-9bdb01847c73"
